  <g id="zlib-note" data-pptx-bounds="640 546 576 70">
    <line x1="640" y1="558" x2="660" y2="558" stroke="#FFB547" stroke-width="2"/>
    <text x="670" y="564" font-size="16" fill="#9FB6CF">Probably the 2nd most deployed library after zlib — and since it is<tspan x="670" dy="22">often statically linked many times per device, it <tspan font-style="italic">might</tspan> be the 1st.</tspan></text>
