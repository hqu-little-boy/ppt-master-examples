</g>
    <text x="58" y="568" font-family="Bahnschrift, sans-serif" font-size="112" font-weight="bold" fill="#FFB547">&gt;1e12</text>
    <text x="64" y="604" font-size="16" fill="#EAF2FB">SQLite databases likely in active use — <tspan font-weight="bold" fill="#FFB547">over one trillion</tspan></text>
  </g>

