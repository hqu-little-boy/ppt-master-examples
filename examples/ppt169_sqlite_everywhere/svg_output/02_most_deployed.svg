</g>
    <text x="64" y="378" font-family="Bahnschrift, sans-serif" font-size="40" fill="#8CC4EE">hundreds</text>
    <text x="64" y="402" font-size="16" fill="#9FB6CF">of SQLite database files held on each phone</text>
    <g id="p02-op-equals" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="mathEqual" data-pptx-frame="64 416 40 40" fill="#FFB547" stroke="none">
