    <text x="64" y="276" font-size="16" fill="#9FB6CF">smartphones in active use (4.0e9)</text>
    <g id="p02-op-times" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="mathMultiply" data-pptx-frame="64 282 40 40" fill="#8CC4EE" stroke="none">
