    <text x="64" y="126" font-family="Bahnschrift, sans-serif" font-size="40" fill="#EAF2FB">SQLite likely outnumbers all other engines combined</text>
  </g>

  <g id="arithmetic" data-pptx-bounds="54 168 550 448">
