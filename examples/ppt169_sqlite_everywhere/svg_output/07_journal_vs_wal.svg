    <text x="656" y="466" font-size="16" fill="#EAF2FB">WAL file <tspan font-family="Consolas, monospace" font-size="15" fill="#5ED3C4">-wal</tspan></text>
  </g>

  <g id="wal-commit" data-pptx-bounds="944 432 272 180">
    <line x1="944" y1="458" x2="960" y2="458" stroke="#FFB547" stroke-width="2"/>
    <text x="968" y="464" font-size="20" font-weight="bold" fill="#FFB547">② COMMIT =</text>
    <text x="968" y="494" font-size="20" fill="#EAF2FB">a commit record<tspan x="968" dy="28">appended to the WAL</tspan></text>
    <text x="968" y="572" font-size="16" fill="#9FB6CF">The database file is never<tspan x="968" dy="22">touched to commit.</tspan></text>
