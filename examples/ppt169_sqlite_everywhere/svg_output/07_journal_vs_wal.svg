    <line x1="716" y1="290" x2="516" y2="290" stroke="#8CC4EE" stroke-width="1.25" stroke-dasharray="8,4" marker-end="url(#arrowCyan)"/>
    <text x="528" y="312" font-size="13" fill="#9FB6CF">crash or ROLLBACK: play the journal back</text>
