    <text x="64" y="186" font-size="15" letter-spacing="2" fill="#8CC4EE">ROLLBACK JOURNAL</text>
    <text x="64" y="216" font-size="16" fill="#9FB6CF">The default mode.</text>
    <text x="64" y="256" font-size="22" fill="#EAF2FB">Save the old pages,<tspan x="64" dy="30">overwrite in place.</tspan></text>
  </g>

  <g id="rb-diagram" data-pptx-bounds="288 180 640 172">
    <rect x="292" y="196" width="216" height="124" fill="none" stroke="#8CC4EE" stroke-width="1.5" rx="2"/>
    <text x="308" y="222" font-size="16" fill="#EAF2FB">database file</text>
