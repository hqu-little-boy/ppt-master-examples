      <rect x="702" y="484" width="38" height="56" fill="#11294B" stroke="#5ED3C4"/>
      <rect x="748" y="484" width="38" height="56" fill="#11294B" stroke="#5ED3C4"/>
      <rect x="794" y="484" width="38" height="56" fill="#11294B" stroke="#5ED3C4"/>
      <rect x="840" y="484" width="38" height="56" fill="#11294B" stroke="#5ED3C4"/>
