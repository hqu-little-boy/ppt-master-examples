      <rect x="784" y="240" width="40" height="56"/>
    </g>
    <text x="292" y="344" font-size="16" fill="#EAF2FB">② write the changes <tspan fill="#FFB547">directly into the database</tspan></text>
  </g>

  <g id="rb-commit" data-pptx-bounds="944 188 272 156">
    <line x1="944" y1="214" x2="960" y2="214" stroke="#FFB547" stroke-width="2"/>
