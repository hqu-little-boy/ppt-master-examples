  <g id="cover-rule" data-pptx-bounds="64 530 420 8">
    <line x1="72" y1="534" x2="472" y2="534" stroke="#8CC4EE" stroke-width="1.25" stroke-dasharray="8,4,2,4"/>
  </g>

  <g id="cover-source" data-pptx-bounds="64 620 600 32">
