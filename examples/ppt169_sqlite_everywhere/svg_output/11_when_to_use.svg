<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#FF7A6B"/>
    </marker>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#8CC4EE"/>
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#0B1F3A"/>
  <g id="sheet-grid" data-pptx-role="decoration" data-pptx-bounds="20 20 1240 680" stroke="#16305A" stroke-width="1">
    <line x1="128" y1="20" x2="128" y2="700"/><line x1="256" y1="20" x2="256" y2="700"/><line x1="384" y1="20" x2="384" y2="700"/><line x1="512" y1="20" x2="512" y2="700"/><line x1="640" y1="20" x2="640" y2="700"/><line x1="768" y1="20" x2="768" y2="700"/><line x1="896" y1="20" x2="896" y2="700"/><line x1="1024" y1="20" x2="1024" y2="700"/><line x1="1152" y1="20" x2="1152" y2="700"/>
    <line x1="20" y1="128" x2="1260" y2="128"/><line x1="20" y1="256" x2="1260" y2="256"/><line x1="20" y1="384" x2="1260" y2="384"/><line x1="20" y1="512" x2="1260" y2="512"/><line x1="20" y1="640" x2="1260" y2="640"/>
    <rect x="20" y="20" width="1240" height="680" fill="none" stroke="#2D4C74"/>
  </g>

  <g id="header" data-pptx-bounds="64 44 1152 100">
    <text x="64" y="78" font-size="15" letter-spacing="2" fill="#8CC4EE">10 · CHOOSING IT — THE OFFICIAL CHECKLIST</text>
    <text x="64" y="126" font-family="Bahnschrift, sans-serif" font-size="40" fill="#EAF2FB">Three questions before you pick SQLite</text>
  </g>

  <g id="gate-network" data-pptx-bounds="56 172 680 112">
    <g id="p11-q1" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartDecision" data-pptx-frame="64 180 56 56" fill="#11294B" stroke="#8CC4EE" stroke-width="1.5">
<path d="M 64 208 L 92 180 L 120 208 L 92 236 Z"/>
</g>
    <text x="92" y="214" font-family="Consolas, monospace" font-size="17" fill="#8CC4EE" text-anchor="middle">1</text>
    <text x="136" y="202" font-size="20" fill="#EAF2FB">Is the data separated from the<tspan x="136" dy="26">application by a network?</tspan></text>
    <line x1="440" y1="208" x2="556" y2="208" stroke="#FF7A6B" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <text x="504" y="198" font-size="13" fill="#FF7A6B">yes</text>
    <rect x="564" y="190" width="164" height="36" fill="none" stroke="#FF7A6B" stroke-width="1.5" rx="2"/>
    <use data-icon="tabler-outline/server" x="574" y="196" width="24" height="24" fill="#FF7A6B" stroke-width="1.5"/>
    <text x="606" y="214" font-size="16" fill="#FF7A6B">client/server</text>
    <line x1="92" y1="236" x2="92" y2="280" stroke="#8CC4EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <text x="102" y="266" font-size="13" fill="#9FB6CF">no</text>
  </g>

  <g id="gate-writers" data-pptx-bounds="56 284 680 104">
    <g id="p11-q2" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartDecision" data-pptx-frame="64 284 56 56" fill="#11294B" stroke="#8CC4EE" stroke-width="1.5">
<path d="M 64 312 L 92 284 L 120 312 L 92 340 Z"/>
</g>
    <text x="92" y="318" font-family="Consolas, monospace" font-size="17" fill="#8CC4EE" text-anchor="middle">2</text>
    <text x="136" y="306" font-size="20" fill="#EAF2FB">Many concurrent writers that<tspan x="136" dy="26">cannot queue and take turns?</tspan></text>
    <text x="136" y="358" font-size="13" fill="#9FB6CF">SQLite: unlimited readers, one writer at a time; writes usually take milliseconds</text>
    <line x1="440" y1="312" x2="556" y2="312" stroke="#FF7A6B" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <text x="504" y="302" font-size="13" fill="#FF7A6B">yes</text>
    <rect x="564" y="294" width="164" height="36" fill="none" stroke="#FF7A6B" stroke-width="1.5" rx="2"/>
    <use data-icon="tabler-outline/server" x="574" y="300" width="24" height="24" fill="#FF7A6B" stroke-width="1.5"/>
    <text x="606" y="318" font-size="16" fill="#FF7A6B">client/server</text>
    <line x1="92" y1="340" x2="92" y2="384" stroke="#8CC4EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <text x="102" y="376" font-size="13" fill="#9FB6CF">no</text>
  </g>

  <g id="gate-size" data-pptx-bounds="56 388 680 112">
    <g id="p11-q3" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartDecision" data-pptx-frame="64 388 56 56" fill="#11294B" stroke="#8CC4EE" stroke-width="1.5">
<path d="M 64 416 L 92 388 L 120 416 L 92 444 Z"/>
</g>
    <text x="92" y="422" font-family="Consolas, monospace" font-size="17" fill="#8CC4EE" text-anchor="middle">3</text>
    <text x="136" y="410" font-size="20" fill="#EAF2FB">Big data — more than one file<tspan x="136" dy="26">can hold? (limit: 281 TB)</tspan></text>
    <line x1="440" y1="416" x2="556" y2="416" stroke="#FF7A6B" stroke-width="1.5" marker-end="url(#arrowRed)"/>
    <text x="504" y="406" font-size="13" fill="#FF7A6B">yes</text>
    <rect x="564" y="398" width="164" height="36" fill="none" stroke="#FF7A6B" stroke-width="1.5" rx="2"/>
    <use data-icon="tabler-outline/server" x="574" y="404" width="24" height="24" fill="#FF7A6B" stroke-width="1.5"/>
    <text x="606" y="422" font-size="16" fill="#FF7A6B">client/server</text>
    <line x1="92" y1="444" x2="92" y2="496" stroke="#8CC4EE" stroke-width="1.5" marker-end="url(#arrowCyan)"/>
    <text x="102" y="476" font-size="13" fill="#9FB6CF">no</text>
  </g>

  <g id="gate-choose" data-pptx-bounds="56 500 680 76">
    <g id="p11-choose" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="flowChartTerminator" data-pptx-frame="64 500 360 60" fill="#11294B" stroke="#FFB547" stroke-width="2">
<path d="M 121.92 500 L 366.08 500 A 57.92 30 0 0 1 366.08 560 L 121.92 560 A 57.92 30 0 0 1 121.92 500 Z"/>
</g>
    <text x="244" y="538" font-size="22" font-weight="bold" fill="#FFB547" text-anchor="middle">Otherwise → choose SQLite</text>
  </g>

  <g id="works-well" data-pptx-bounds="768 164 448 336" font-size="16" fill="#EAF2FB">
    <text x="768" y="186" font-size="15" letter-spacing="2" fill="#5ED3C4">WHERE IT WORKS WELL</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="204" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="220">Embedded devices and the internet of things</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="236" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="252">Application file format</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="268" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="284">Websites under ~100K hits/day</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="300" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="316">Data analysis</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="332" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="348">Cache for enterprise data</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="364" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="380">Server-side database (e.g. one DB per user)</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="396" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="412">Data transfer format</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="428" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="444">File archive or data container</text>
    <use data-icon="tabler-outline/circle-check" x="768" y="460" width="20" height="20" fill="#5ED3C4" stroke-width="1.5"/>
    <text x="796" y="476">Internal or temporary databases</text>
  </g>

  <g id="traffic-note" data-pptx-bounds="768 516 448 92">
    <line x1="768" y1="526" x2="784" y2="526" stroke="#FFB547" stroke-width="2"/>
    <text x="792" y="532" font-size="16" fill="#9FB6CF">100K hits/day is a conservative estimate,<tspan x="792" dy="22">not a hard upper bound — SQLite has been</tspan><tspan x="792" dy="22">demonstrated at 10 times that traffic.</tspan></text>
  </g>

  <g id="title-block" data-pptx-role="footer" data-pptx-bounds="880 650 336 38">
    <rect x="880" y="654" width="336" height="30" fill="#11294B" stroke="#2D4C74"/>
    <line x1="972" y1="654" x2="972" y2="684" stroke="#2D4C74"/>
    <text x="892" y="674" font-family="Consolas, monospace" font-size="13" fill="#8CC4EE">SHT 11/12</text>
    <text x="984" y="674" font-size="13" fill="#9FB6CF">Source: sqlite.org/whentouse</text>
  </g>
</svg>
