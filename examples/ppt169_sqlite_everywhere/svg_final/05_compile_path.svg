  <g id="sql-input" data-pptx-bounds="264 156 952 60">
    <rect x="264" y="160" width="952" height="52" fill="none" stroke="#2D4C74" stroke-width="1.25" stroke-dasharray="4,4" rx="2" />
    <text x="282" y="192" font-size="15" letter-spacing="2" fill="#9FB6CF">SQL TEXT</text>
    <text x="400" y="193" font-family="Consolas, monospace" font-size="19" fill="#EAF2FB">SELECT name FROM users WHERE id = ?</text>
  </g>

  <g id="stage-tokenizer" data-pptx-bounds="264 232 232 254">
    <g id="p05-stage-tokenizer" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="homePlate" data-pptx-frame="264 236 232 52" fill="#11294B" stroke="#FFB547" stroke-width="1.5">
<path d="M 264 236 L 470 236 L 496 262 L 470 288 L 264 288 Z" />
</g>
    <text x="370" y="268" font-size="15" letter-spacing="2" fill="#FFB547" text-anchor="middle">TOKENIZER</text>
    <text font-size="20" fill="#EAF2FB" x="272" y="330">Splits SQL text into</text><text font-size="20" fill="#EAF2FB" x="272" y="358">tokens; hand-coded</text><text font-size="20" fill="#EAF2FB" x="272" y="386"><tspan>in <tspan font-family="Consolas, monospace" font-size="19" fill="#8CC4EE">tokenize.c</tspan>.</tspan></text><text font-size="20" fill="#FFB547" x="272" y="414" font-weight="bold">The tokenizer calls</text><text font-size="20" fill="#FFB547" x="272" y="442" font-weight="bold">the parser</text><text font-size="20" fill="#EAF2FB" x="272" y="470">— threadsafe, faster.</text></g>

  <g id="stage-parser" data-pptx-bounds="500 232 236 254">
    <g id="p05-stage-parser" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="500 236 236 52" fill="#11294B" stroke="#FFB547" stroke-width="1.5">
<path d="M 500 236 L 710 236 L 736 262 L 710 288 L 500 288 L 526 262 Z" />
</g>
    <text x="618" y="268" font-size="15" letter-spacing="2" fill="#FFB547" text-anchor="middle">PARSER</text>
    <text font-size="20" fill="#EAF2FB" x="508" y="330">Gives tokens meaning</text><text font-size="20" fill="#EAF2FB" x="508" y="358">by context; generated</text><text font-size="20" fill="#EAF2FB" x="508" y="386"><tspan>by Lemon from <tspan font-family="Consolas, monospace" font-size="19" fill="#8CC4EE">parse.y</tspan></tspan></text><text font-size="20" fill="#EAF2FB" x="508" y="414">— reentrant, thread-</text><text font-size="20" fill="#EAF2FB" x="508" y="442">safe, no leaks on</text><text font-size="20" fill="#EAF2FB" x="508" y="470">syntax errors.</text></g>

  <g id="stage-codegen" data-pptx-bounds="740 232 236 254">
    <g id="p05-stage-codegen" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="740 236 236 52" fill="#11294B" stroke="#FFB547" stroke-width="1.5">
<path d="M 740 236 L 950 236 L 976 262 L 950 288 L 740 288 L 766 262 Z" />
</g>
    <text x="858" y="268" font-size="15" letter-spacing="2" fill="#FFB547" text-anchor="middle">CODE GENERATOR</text>
    <text font-size="20" fill="#EAF2FB" x="748" y="330">Walks the parse tree</text><text font-size="20" fill="#EAF2FB" x="748" y="358">and emits bytecode.</text><text font-size="20" fill="#EAF2FB" x="748" y="386"><tspan><tspan font-family="Consolas, monospace" font-size="19" fill="#8CC4EE">where*.c</tspan> + <tspan font-family="Consolas, monospace" font-size="19" fill="#8CC4EE">select.c</tspan></tspan></text><text font-size="20" fill="#EAF2FB" x="748" y="414">are the query planner,</text><text font-size="20" fill="#EAF2FB" x="748" y="442">picking among possibly</text><text font-size="20" fill="#EAF2FB" x="748" y="470">millions of algorithms.</text></g>

  <g id="stage-vdbe" data-pptx-bounds="980 232 236 254">
    <g id="p05-stage-vdbe" data-pptx-authoring="preset" data-pptx-object="shape" data-pptx-prst="chevron" data-pptx-frame="980 236 236 52" fill="#11294B" stroke="#8CC4EE" stroke-width="1.5">
<path d="M 980 236 L 1190 236 L 1216 262 L 1190 288 L 980 288 L 1006 262 Z" />
</g>
    <text x="1098" y="268" font-size="15" letter-spacing="2" fill="#8CC4EE" text-anchor="middle">VDBE</text>
    <text font-size="20" fill="#EAF2FB" x="988" y="330"><tspan font-family="Consolas, monospace" font-size="19" fill="#8CC4EE">sqlite3_stmt</tspan> holds</text><text font-size="20" fill="#EAF2FB" x="988" y="358">one bytecode program;</text><text font-size="20" fill="#EAF2FB" x="988" y="386"><tspan><tspan font-family="Consolas, monospace" font-size="19" fill="#8CC4EE">sqlite3_step()</tspan> runs</tspan></text><text font-size="20" fill="#EAF2FB" x="988" y="414">it until done, a row,</text><text font-size="20" fill="#EAF2FB" x="988" y="442">a fatal error, or</text><text font-size="20" fill="#EAF2FB" x="988" y="470">an interrupt.</text></g>

  <g id="api-prepare" data-pptx-bounds="264 500 712 60">
    <line x1="266" y1="516" x2="974" y2="516" stroke="#8CC4EE" stroke-width="1.25" />
    <line x1="266" y1="506" x2="266" y2="526" stroke="#8CC4EE" stroke-width="1.25" />
