    <text x="620" y="550" font-family="Consolas, monospace" font-size="17" fill="#8CC4EE" text-anchor="middle">sqlite3_prepare_v2()  ·  compile</text>
  </g>

  <g id="api-step" data-pptx-bounds="980 500 236 60">
    <line x1="984" y1="516" x2="1214" y2="516" stroke="#FFB547" stroke-width="1.25" />
    <line x1="984" y1="506" x2="984" y2="526" stroke="#FFB547" stroke-width="1.25" />
    <line x1="1214" y1="506" x2="1214" y2="526" stroke="#FFB547" stroke-width="1.25" />
    <text x="1099" y="550" font-family="Consolas, monospace" font-size="17" fill="#FFB547" text-anchor="middle">sqlite3_step() · run</text>
  </g>

  <g id="tokenizer-inversion" data-pptx-bounds="264 580 600 52" font-size="16">
    <text x="264" y="600" fill="#9FB6CF">YACC/BISON habit: the parser calls the tokenizer.</text>
    <text x="264" y="624" fill="#EAF2FB">SQLite inverts it: <tspan font-weight="bold" fill="#FFB547">the tokenizer calls the parser.</tspan></text>
  </g>

