  <g id="header" data-pptx-bounds="64 44 1152 100">
    <text x="64" y="78" font-size="15" letter-spacing="2" fill="#8CC4EE">04 · HOW IT WORKS — COMPILE PATH (LAYERS 02–04)</text>
    <text x="64" y="126" font-family="Bahnschrift, sans-serif" font-size="40" fill="#EAF2FB">From SQL text to a bytecode program</text>
  </g>

  <g id="stack-rail" data-pptx-bounds="64 164 160 432">
    <g fill="#11294B" stroke="#8CC4EE" stroke-width="1.5">
