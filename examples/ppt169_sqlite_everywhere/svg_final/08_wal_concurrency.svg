      <polygon points="0,0 10,5 0,10" fill="#8CC4EE" />
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#FFB547" />
    </marker>
  </defs>
  <rect id="bg" x="0" y="0" width="1280" height="720" fill="#0B1F3A" />
  <g id="sheet-grid" data-pptx-role="decoration" data-pptx-bounds="20 20 1240 680" stroke="#16305A" stroke-width="1">
    <line x1="128" y1="20" x2="128" y2="700" /><line x1="256" y1="20" x2="256" y2="700" /><line x1="384" y1="20" x2="384" y2="700" /><line x1="512" y1="20" x2="512" y2="700" /><line x1="640" y1="20" x2="640" y2="700" /><line x1="768" y1="20" x2="768" y2="700" /><line x1="896" y1="20" x2="896" y2="700" /><line x1="1024" y1="20" x2="1024" y2="700" /><line x1="1152" y1="20" x2="1152" y2="700" />
    <line x1="20" y1="128" x2="1260" y2="128" /><line x1="20" y1="256" x2="1260" y2="256" /><line x1="20" y1="384" x2="1260" y2="384" /><line x1="20" y1="512" x2="1260" y2="512" /><line x1="20" y1="640" x2="1260" y2="640" />
    <rect x="20" y="20" width="1240" height="680" fill="none" stroke="#2D4C74" />
  </g>

  <g id="header" data-pptx-bounds="64 44 1152 100">
    <text x="64" y="78" font-size="15" letter-spacing="2" fill="#5ED3C4">07 · INSIDE WAL MODE</text>
    <text x="64" y="126" font-family="Bahnschrift, sans-serif" font-size="40" fill="#EAF2FB">WAL: readers never block the writer</text>
  </g>

  <g id="wal-file" data-pptx-bounds="64 168 644 128">
    <rect x="64" y="172" width="640" height="120" fill="none" stroke="#5ED3C4" stroke-width="1.5" rx="2" />
    <g stroke-width="1.5">
      <rect x="84" y="214" width="84" height="60" fill="#11294B" stroke="#5ED3C4" />
      <rect x="184" y="214" width="84" height="60" fill="#11294B" stroke="#5ED3C4" />
      <rect x="284" y="214" width="84" height="60" fill="#11294B" stroke="#5ED3C4" />
      <rect x="384" y="214" width="84" height="60" fill="#11294B" stroke="#5ED3C4" />
      <rect x="484" y="214" width="84" height="60" fill="#11294B" stroke="#5ED3C4" />
      <rect x="584" y="214" width="84" height="60" fill="#FFB547" fill-opacity="0.35" stroke="#FFB547" />
    </g>
    <text x="84" y="200" font-size="16" fill="#EAF2FB">WAL file <tspan font-family="Consolas, monospace" font-size="15" fill="#5ED3C4">-wal</tspan>  ·  frames in append order</text>
  </g>

  <g id="end-marks" data-pptx-bounds="300 296 380 52">
    <line x1="376" y1="296" x2="376" y2="318" stroke="#5ED3C4" stroke-width="2" />
    <line x1="576" y1="296" x2="576" y2="318" stroke="#5ED3C4" stroke-width="2" />
    <g font-size="13" fill="#5ED3C4" text-anchor="middle">
      <text x="376" y="336">reader A end mark</text>
      <text x="576" y="336">reader B end mark</text>
    </g>
  </g>

  <g id="writer-note" data-pptx-bounds="716 168 500 128">
    <line x1="808" y1="244" x2="714" y2="244" stroke="#FFB547" stroke-width="1.5" marker-end="url(#arrowAmber)" />
    <text font-size="20" fill="#EAF2FB" x="820" y="226">The <tspan font-weight="bold" fill="#FFB547">single writer</tspan> appends</text><text font-size="20" fill="#EAF2FB" x="820" y="254">new frames at the end; each</text><text font-size="20" fill="#EAF2FB" x="820" y="282">reader keeps its own snapshot.</text></g>

  <g id="checkpoint" data-pptx-bounds="64 298 232 126">
    <line x1="184" y1="300" x2="184" y2="366" stroke="#8CC4EE" stroke-width="1.5" stroke-dasharray="8,4" marker-end="url(#arrowCyan)" />
    <rect x="84" y="372" width="200" height="48" fill="#11294B" stroke="#8CC4EE" stroke-width="1.5" rx="2" />
    <text x="184" y="402" font-size="16" fill="#EAF2FB" text-anchor="middle">database file</text>
  </g>

  <g id="checkpoint-note" data-pptx-bounds="300 372 916 56" font-size="16">
    <text x="304" y="392" fill="#EAF2FB"><tspan font-weight="bold" fill="#8CC4EE">Checkpoint</tspan> copies WAL pages back into the database, stopping at the oldest active reader's end mark.</text>
    <text x="304" y="416" fill="#9FB6CF">Automatic once the WAL reaches <tspan font-weight="bold" fill="#FFB547">1000 pages</tspan>; when fully checkpointed and idle, the WAL rewinds to its start.</text>
  </g>

  <g id="col-consistency" data-pptx-bounds="64 452 368 188" font-size="16" fill="#EAF2FB">
    <text x="64" y="468" font-size="15" letter-spacing="2" fill="#9FB6CF">HOW IT STAYS CONSISTENT</text>
    <text x="64" y="500">· One end mark per read = one snapshot</text>
    <text x="64" y="530">· A shared-memory wal-index finds pages</text><text x="64" y="552">fast, so all processes share one host</text><text x="64" y="582">· One WAL file → one writer at a time</text>
    <text x="64" y="612">· A long reader can stall the checkpointer</text>
  </g>

  <g id="col-pros" data-pptx-bounds="456 452 368 188" font-size="16" fill="#EAF2FB">
    <text x="456" y="468" font-size="15" letter-spacing="2" fill="#5ED3C4">WHY WAL</text>
    
  <g transform="translate(456, 484) scale(0.833333)" fill="none" stroke="#5ED3C4" stroke-width="1.5">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="484" y="500">Significantly faster in most scenarios</text>
    
  <g transform="translate(456, 514) scale(0.833333)" fill="none" stroke="#5ED3C4" stroke-width="1.5">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="484" y="530">Readers and the writer run concurrently</text>
    
  <g transform="translate(456, 544) scale(0.833333)" fill="none" stroke="#5ED3C4" stroke-width="1.5">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="484" y="560">More sequential disk I/O</text>
    
  <g transform="translate(456, 574) scale(0.833333)" fill="none" stroke="#5ED3C4" stroke-width="1.5">
    <path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0 -18 0" />
    <path d="M9 12l2 2l4 -4" />
  </g>
    <text x="484" y="590">Far fewer <tspan font-family="Consolas, monospace" font-size="15" fill="#8CC4EE">fsync()</tspan> calls</text>
  </g>

  <g id="col-cons" data-pptx-bounds="848 452 368 188" font-size="16" fill="#EAF2FB">
    <text x="848" y="468" font-size="15" letter-spacing="2" fill="#FF7A6B">WHAT IT COSTS</text>
    
  <g transform="translate(848, 484) scale(0.833333)" fill="none" stroke="#FF7A6B" stroke-width="1.5">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="876" y="500">Same host only — no network filesystem</text>
    
  <g transform="translate(848, 514) scale(0.833333)" fill="none" stroke="#FF7A6B" stroke-width="1.5">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="876" y="530">Extra <tspan font-family="Consolas, monospace" font-size="15" fill="#8CC4EE">-wal</tspan> and <tspan font-family="Consolas, monospace" font-size="15" fill="#8CC4EE">-shm</tspan> files beside the DB</text>
    
  <g transform="translate(848, 544) scale(0.833333)" fill="none" stroke="#FF7A6B" stroke-width="1.5">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="876" y="560">1–2% slower for read-mostly work</text>
    
  <g transform="translate(848, 574) scale(0.833333)" fill="none" stroke="#FF7A6B" stroke-width="1.5">
    <path d="M12 9v4" />
    <path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" />
    <path d="M12 16h.01" />
  </g>
    <text x="876" y="590">Prefers small transactions; rollback</text><text x="876" y="612">modes suit ones over ~100 MB</text></g>

