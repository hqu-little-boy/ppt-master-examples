<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <defs>
    <marker id="arrow-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#161616" />
    </marker>
    <clipPath id="white-city-clip">
      <polygon points="1010,232 1216,232 1186,540 980,540" />
    </clipPath>
  </defs>
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F2EEE5" />

  <g id="header" data-pptx-bounds="64 70 1152 140">
    <text x="64" y="96" font-size="15" fill="#6B665C" letter-spacing="2">11 · 流散 · EMIGRATION</text>
    <text x="64" y="150" font-size="40" font-weight="bold" fill="#161616">关门之后，方法出发</text>
    <text x="64" y="194" font-size="22" fill="#1E1E1C">关闭让包豪斯的人四散，也让它的方法在新的学校与城市里落地。</text>
  </g>

  <g id="motif-origin" data-pptx-role="decoration" data-pptx-bounds="110 310 160 160">
    <circle cx="190" cy="390" r="76" fill="#C23B22" />
  </g>

  <g id="origin-label" data-pptx-bounds="130 350 120 80" fill="#F2EEE5" text-anchor="middle">
    <text x="190" y="384" font-size="22" font-weight="bold">德国</text>
    <text x="190" y="412" font-size="16">1933 年后</text>
  </g>

  <g id="routes" data-pptx-bounds="268 236 200 330" stroke="#161616" stroke-width="1.5">
    <line x1="268" y1="372" x2="462" y2="258" marker-end="url(#arrow-ink)" />
    <line x1="268" y1="382" x2="462" y2="330" marker-end="url(#arrow-ink)" />
    <line x1="268" y1="392" x2="462" y2="402" marker-end="url(#arrow-ink)" />
    <line x1="268" y1="402" x2="462" y2="474" marker-end="url(#arrow-ink)" />
    <line x1="268" y1="412" x2="462" y2="546" stroke-dasharray="8,4" marker-end="url(#arrow-ink)" />
  </g>

  <g id="destinations" data-pptx-bounds="480 232 480 348">
    <text x="480" y="258" font-size="22" font-weight="bold" fill="#161616">1933 · 阿尔伯斯 → 黑山学院</text>
    <text x="480" y="282" font-size="16" fill="#6B665C">北卡罗来纳州，执教至 1949；1950 年起主持耶鲁设计系</text>
    <text x="480" y="330" font-size="22" font-weight="bold" fill="#161616">1937 · 格罗皮乌斯 → 哈佛</text>
    <text x="480" y="354" font-size="16" fill="#6B665C">1937–1952 年任教哈佛设计研究生院</text>
    <text x="480" y="402" font-size="22" font-weight="bold" fill="#161616">1937 · 莫霍利-纳吉 → 芝加哥</text>
    <text x="480" y="426" font-size="16" fill="#6B665C">创办新包豪斯；1944 年改名设计学院，1949 年并入 IIT</text>
    <text x="480" y="474" font-size="22" font-weight="bold" fill="#161616">1937/38 · 密斯 → 芝加哥</text>
    <text x="480" y="498" font-size="16" fill="#6B665C">主持阿穆尔理工学院建筑系（1940 年并入 IIT）</text>
    <text x="480" y="546" font-size="22" font-weight="bold" fill="#161616">1953 · 乌尔姆设计学院</text>
    <text x="480" y="570" font-size="16" fill="#6B665C">比尔、艾舍-绍尔与艾舍创办，延续包豪斯理念，1968 年关闭</text>
  </g>

  <g id="faculty-stat" data-pptx-bounds="64 580 400 84">
    <text x="64" y="602" font-size="15" font-weight="bold" fill="#B8862B" letter-spacing="2">1933–1938</text>
    <text x="64" y="640" font-size="22" fill="#1E1E1C">119 名教员中，约 <tspan font-weight="bold" fill="#C23B22">15 人</tspan>移居国外</text>
  </g>

  <g id="white-city" data-pptx-bounds="976 232 240 400">
    <image href="../images/tel_aviv_white_city.jpg" x="980" y="232" width="236" height="308" preserveAspectRatio="xMidYMin slice" clip-path="url(#white-city-clip)" />
    <text x="980" y="570" font-size="16" fill="#161616"><tspan font-weight="bold">特拉维夫白城</tspan>：4,000 余座<tspan x="980" dy="22">建筑，2003 年世界遗产</tspan></text>
    <text x="980" y="608" font-size="13" fill="#6B665C">图 © Lior Golgher • ליאור גולגר<tspan x="980" dy="17">Wikimedia / CC BY 2.5</tspan></text>
  </g>

  <g id="sources" data-pptx-bounds="64 668 860 28">
    <text x="64" y="688" font-size="13" fill="#6B665C">来源：Wikipedia「Bauhaus」「Walter Gropius」「Josef Albers」「New Bauhaus」「Ludwig Mies van der Rohe」</text>
  </g>
  <g id="footer" data-pptx-role="footer" data-pptx-bounds="960 668 256 28">
    <text x="1216" y="688" font-size="13" fill="#6B665C" text-anchor="end">包豪斯 1919–1933 · 12</text>
  </g>
</svg>
