<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" data-pptx-page-role="content">
  <rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F2EEE5"/>

  <g id="header" data-pptx-bounds="64 70 600 176">
    <text x="64" y="96" font-size="15" fill="#6B665C" letter-spacing="2">04 · 方法 · WERKSTATT</text>
    <text x="64" y="150" font-size="40" font-weight="bold" fill="#161616">一个工坊，两位导师</text>
    <text x="64" y="196" font-size="22" fill="#1E1E1C">艺术家负责形式，工匠负责工艺——<tspan x="64" dy="33">双导师制把艺术与生产放在同一张工作台上。</tspan></text>
  </g>

  <g id="dual-masters" data-pptx-bounds="64 262 600 196">
    <rect x="64" y="270" width="280" height="90" fill="#161616"/>
    <text x="88" y="306" font-size="22" font-weight="bold" fill="#F2EEE5">形式导师</text>
    <text x="88" y="338" font-size="16" fill="#F2EEE5">艺术家 · 例：克利</text>
    <rect x="384" y="270" width="280" height="90" fill="none" stroke="#161616" stroke-width="2"/>
    <text x="408" y="306" font-size="22" font-weight="bold" fill="#161616">工艺导师</text>
    <text x="408" y="338" font-size="16" fill="#1E1E1C">工匠 · 例：阿尔伯斯（1923 起）</text>
    <line x1="204" y1="360" x2="364" y2="400" stroke="#161616" stroke-width="2"/>
    <line x1="524" y1="360" x2="364" y2="400" stroke="#161616" stroke-width="2"/>
    <rect x="64" y="400" width="600" height="50" fill="#E4DDCF"/>
    <text x="364" y="433" font-size="22" font-weight="bold" fill="#161616" text-anchor="middle">同一个工坊 · 例：玻璃画工坊</text>
  </g>

  <g id="note-weaving" data-pptx-bounds="64 486 600 104">
    <text x="64" y="510" font-size="15" font-weight="bold" fill="#B8862B" letter-spacing="2">织造工坊 · 1927</text>
    <text x="64" y="544" font-size="22" fill="#1E1E1C">施特尔策尔 1919 年入学，1927 年成为青年导师，<tspan x="64" dy="33">是包豪斯<tspan font-weight="bold" fill="#C23B22">首位获“导师”头衔的女性</tspan>。</tspan></text>
  </g>

  <g id="note-exhibition" data-pptx-bounds="64 596 600 60">
    <text x="64" y="616" font-size="15" font-weight="bold" fill="#B8862B" letter-spacing="2">1923 展览</text>
    <text x="64" y="646" font-size="22" fill="#1E1E1C">实验作品展（含号角屋）是继续获得州资助的条件</text>
  </g>

  <g id="workshop-image" data-pptx-bounds="704 64 512 584">
    <image href="../images/workshop_scene.jpg" x="704" y="64" width="512" height="584" preserveAspectRatio="xMidYMid slice"/>
    <text x="724" y="632" font-size="13" fill="#F2EEE5">示意场景 · AI 生成，非历史照片</text>
  </g>

  <g id="sources" data-pptx-bounds="64 668 860 28">
