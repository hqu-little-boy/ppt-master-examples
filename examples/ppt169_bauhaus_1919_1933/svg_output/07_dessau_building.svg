<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="&quot;Microsoft YaHei&quot;, Arial, sans-serif" data-pptx-page-role="section">
  <defs>
    <linearGradient id="left-scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#161616" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#161616" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#161616" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <image id="dessau-photo" data-pptx-role="background" href="../images/dessau_building.jpg" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect id="photo-scrim" data-pptx-role="decoration" x="0" y="0" width="820" height="720" fill="url(#left-scrim)"/>

  <g id="header" data-pptx-bounds="64 70 640 180" fill="#F2EEE5">
    <text x="64" y="96" font-size="15" letter-spacing="2">06 · 作品 · DESSAU 1926</text>
    <text x="64" y="156" font-size="40" font-weight="bold">校舍本身就是宣言</text>
    <text x="64" y="200" font-size="22">德绍校舍把玻璃幕墙与功能分区，<tspan x="64" dy="33">变成了一本可以走进去的教材。</tspan></text>
  </g>

  <g id="build-dates" data-pptx-bounds="64 284 520 176" fill="#F2EEE5">
    <line x1="64" y1="292" x2="420" y2="292" stroke="#F2EEE5" stroke-width="1"/>
    <text x="64" y="334" font-size="26" font-weight="bold">1925.9 <tspan font-size="16" font-weight="normal">动工</tspan></text>
    <text x="64" y="384" font-size="26" font-weight="bold">1926.3.21 <tspan font-size="16" font-weight="normal">封顶</tspan></text>
    <text x="64" y="434" font-size="26" font-weight="bold" fill="#C23B22">1926.12.4 <tspan font-size="16" font-weight="normal" fill="#F2EEE5">落成</tspan></text>
  </g>

  <g id="building-parts" data-pptx-bounds="64 476 600 176" fill="#F2EEE5">
    <line x1="64" y1="482" x2="420" y2="482" stroke="#F2EEE5" stroke-width="1"/>
    <text x="64" y="518" font-size="22"><tspan font-weight="bold">工坊翼</tspan>：贯通三层的玻璃幕墙</text>
    <text x="64" y="554" font-size="22"><tspan font-weight="bold">普雷勒楼</tspan>：五层，28 间师生工作室</text>
    <text x="64" y="590" font-size="22"><tspan font-weight="bold">桥楼</tspan>：行政与格罗皮乌斯的建筑事务所</text>
    <text x="64" y="634" font-size="16" font-weight="bold" fill="#B8862B" letter-spacing="2">1996 年列入世界遗产</text>
  </g>

  <g id="glass-callout" data-pptx-bounds="664 392 200 48">
    <circle cx="680" cy="416" r="9" fill="none" stroke="#C23B22" stroke-width="3"/>
    <line x1="689" y1="416" x2="712" y2="416" stroke="#C23B22" stroke-width="2"/>
    <rect x="712" y="400" width="132" height="32" fill="#161616"/>
    <text x="724" y="422" font-size="16" fill="#F2EEE5">工坊翼玻璃幕墙</text>
  </g>

  <g id="credit" data-pptx-bounds="836 676 380 32">
    <rect x="852" y="680" width="364" height="24" fill="#161616" fill-opacity="0.75"/>
